<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#121324" />
      <stop offset="100%" stop-color="#07080e" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#soft-glow)" />
  <circle cx="1020" cy="220" r="180" fill="#818cf8" opacity="0.15" filter="url(#soft-glow)" />
  <circle cx="600" cy="380" r="160" fill="#2dd4bf" opacity="0.10" filter="url(#soft-glow)" />

  <!-- Subtle Cyber Grid -->
  <g stroke="#1e2238" stroke-width="1" opacity="0.45">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- 3D Spatial Hand Landmark Constellation (Right Side) -->
  <g id="hand-constellation" transform="translate(860, 60)">
    <!-- Connections / Bones -->
    <path d="M 120,270 L 120,210 L 80,180 L 50,140 L 30,110" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.8" />
    <path d="M 120,210 L 105,140 L 95,95 L 90,60" stroke="#818cf8" stroke-width="2.5" fill="none" opacity="0.85" />
    <path d="M 120,210 L 125,135 L 128,85 L 130,45" stroke="#a78bfa" stroke-width="2.5" fill="none" opacity="0.85" />
    <path d="M 120,210 L 145,145 L 155,100 L 160,65" stroke="#818cf8" stroke-width="2.5" fill="none" opacity="0.85" />
    <path d="M 120,210 L 165,165 L 180,130 L 190,105" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.8" />

    <!-- Palm cross-links -->
    <path d="M 80,180 L 105,140 L 125,135 L 145,145 L 165,165 Z" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="3,3" fill="none" opacity="0.6" />

    <!-- Euclidean Pinch Distance Highlight between Node 4 (Thumb) and Node 8 (Index) -->
    <line x1="30" y1="110" x2="90" y2="60" stroke="#34d399" stroke-width="3" stroke-dasharray="4,4" filter="url(#glow)" />
    
    <!-- Joint Landmark Nodes (21 Joints) -->
    <!-- Wrist -->
    <circle cx="120" cy="270" r="7" fill="#38bdf8" filter="url(#glow)" />
    <!-- Thumb (Nodes 1, 2, 3, 4) -->
    <circle cx="80" cy="180" r="5" fill="#818cf8" />
    <circle cx="50" cy="140" r="5" fill="#818cf8" />
    <circle cx="30" cy="110" r="8" fill="#34d399" filter="url(#glow)" />
    <!-- Index (Nodes 5, 6, 7, 8) -->
    <circle cx="105" cy="140" r="5" fill="#818cf8" />
    <circle cx="95" cy="95" r="5" fill="#818cf8" />
    <circle cx="90" cy="60" r="8" fill="#34d399" filter="url(#glow)" />
    <!-- Middle (Nodes 9, 10, 11, 12) -->
    <circle cx="125" cy="135" r="5" fill="#818cf8" />
    <circle cx="128" cy="85" r="5" fill="#818cf8" />
    <circle cx="130" cy="45" r="6" fill="#c084fc" />
    <!-- Ring (Nodes 13, 14, 15, 16) -->
    <circle cx="145" cy="145" r="5" fill="#818cf8" />
    <circle cx="155" cy="100" r="5" fill="#818cf8" />
    <circle cx="160" cy="65" r="6" fill="#c084fc" />
    <!-- Pinky (Nodes 17, 18, 19, 20) -->
    <circle cx="165" cy="165" r="5" fill="#818cf8" />
    <circle cx="180" cy="130" r="5" fill="#818cf8" />
    <circle cx="190" cy="105" r="6" fill="#c084fc" />

    <!-- Node Coordinate Hologram Tag -->
    <rect x="-10" y="30" width="130" height="24" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2" opacity="0.9" />
    <text x="55" y="46" font-family="'Courier New', monospace" font-size="11" fill="#34d399" text-anchor="middle" font-weight="700">d₃ᴅ(N₄, N₈) &lt; 0.06</text>
  </g>

  <!-- Left Content Block -->
  <g transform="translate(80, 75)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="340" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#34d399" />
    <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#c7d2fe" font-weight="600" letter-spacing="0.5">
      TOUCHLESS WORKFLOW CONTROLLER • v2.4
    </text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" fill="#ffffff" font-weight="800" letter-spacing="-1">
      GESTURE STUDIO <tspan fill="url(#accent-cyan)">PRO</tspan>
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94a3b8" font-weight="400">
      Spatial 3D Hand Tracking &amp; Context-Aware Macro Automation
    </text>

    <!-- Bullet Tag Matrix -->
    <g transform="translate(0, 165)">
      <!-- Tag 1: MediaPipe 3D -->
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#13172c" stroke="#2dd4bf" stroke-width="1" />
      <text x="82" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#2dd4bf" font-weight="600" text-anchor="middle">
        ⚡ 21 Joint 3D Telemetry
      </text>

      <!-- Tag 2: Deep Learning -->
      <rect x="175" y="0" width="165" height="34" rx="8" fill="#13172c" stroke="#818cf8" stroke-width="1" />
      <text x="257" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#818cf8" font-weight="600" text-anchor="middle">
        🧠 98.6% Neural Inference
      </text>

      <!-- Tag 3: Creative Suite -->
      <rect x="350" y="0" width="185" height="34" rx="8" fill="#13172c" stroke="#f472b6" stroke-width="1" />
      <text x="442" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#f472b6" font-weight="600" text-anchor="middle">
        🎬 Premiere • Figma • Web
      </text>

      <!-- Tag 4: Sub-3ms Latency -->
      <rect x="545" y="0" width="145" height="34" rx="8" fill="#13172c" stroke="#fbbf24" stroke-width="1" />
      <text x="617" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#fbbf24" font-weight="600" text-anchor="middle">
        🚀 &lt;3ms Real-time Latency
      </text>
    </g>

    <!-- Tech Stack Pill Ribbon -->
    <g transform="translate(0, 220)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#64748b" font-weight="500">
        POWERED BY:
      </text>
      <text x="95" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">
        Python 3.10+ <tspan fill="#475569">|</tspan> PyTorch 2.0+ <tspan fill="#475569">|</tspan> Google MediaPipe <tspan fill="#475569">|</tspan> OpenCV <tspan fill="#475569">|</tspan> Flutter UI <tspan fill="#475569">|</tspan> PyInstaller
      </text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#accent-cyan)" />
</svg>
