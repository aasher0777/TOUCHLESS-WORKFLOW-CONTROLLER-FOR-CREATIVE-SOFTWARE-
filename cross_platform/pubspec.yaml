name: gesture_studio_crossplatform
description: Unified Cross-Platform MediaPipe Gesture Controller & Telemetry Workbench (Android, iOS & Windows)
version: 3.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Native Hardware Camera Streaming & Texture Sharing
  camera: ^0.10.5+9
  camera_platform_interface: ^2.6.0
  camera_windows: ^0.2.1+8

  # High-Performance State Management & Telemetry
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9

  # Low-Level Foreign Function Interface (FFI) for MediaPipe C++ bindings
  ffi: ^2.1.0

  # Desktop Window & Viewport Management (Windows Desktop)
  window_manager: ^0.3.8

  # Device Hardware Telemetry & Architecture Diagnostics
  device_info_plus: ^9.1.1
  package_info_plus: ^5.0.1

  # Vector Math for 3D Euclidean Spatial Computing
  vector_math: ^2.1.4

  # UI & Visual Styling
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/icons/
